[package]
name = "adelpha"
version = "0.1.0"
description = "Adelpha"
authors = ["Adelpha / Geethanath lab"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "adelpha_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
