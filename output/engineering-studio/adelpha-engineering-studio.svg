<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Adelpha Engineering Studio architecture</title><desc id="desc">The React studio interface exchanges study inputs and results with a local Python runtime. Engineering modules support magnet studies, gradient coils, passive shimming and MRzero sequence simulation. Project metadata and CAD are stored locally. Optional ADK agents provide AI assistance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627789"/></marker></defs><rect width="1600" height="1080" fill="#f8fafb"/>
