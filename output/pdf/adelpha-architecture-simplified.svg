<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="84.75mm" viewBox="0 0 1200 565">
<title>Simplified Adelpha architecture</title>
<desc>Three desktop workspaces connect through an authenticated local API to the Python sidecar. Engineering Studio uses shimming, gradient design, RF coil design, and Elmer simulations. Digital Twin uses telemetry and assessment services. Imaging Console uses acquisition and reconstruction services. Agent services are optional.</desc>
