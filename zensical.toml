[project]
site_name = "Adelpha"
site_description = "Intelligent Magnetic Resonance Framework. Digital Twin, Imaging Console, Twin API (:8080), MRI API (:8002)."
site_author = "LeoMcBills"
site_url = "https://imr-framework.github.io/adelpha/"
repo_url = "https://github.com/imr-framework/adelpha"
copyright = """
Copyright &copy; 2026 Adelpha contributors
"""
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
extra_css = [
  "stylesheets/extra.css",
]

nav = [
  { "Get started" = [
      { "What is Adelpha?" = "index.md" },
      { "Getting started" = "start/index.md" },
    ]
  },

  { Guide = [
      { Architecture = "guide/architecture.md" },
      { Workspaces = "guide/workspaces.md" },
      { Settings = "guide/settings.md" },
      { Dashboard = "guide/dashboard.md" },
      { "Imaging Console" = "guide/imaging-console.md" },
      { "Twin API" = "guide/twin-api.md" },
      { Configuration = "guide/configuration.md" },
      { "Desktop packaging" = "packaging/index.md" },
    ]
  },

  { Project = [
      { "Docs site" = "project/docs-site.md" },
    ]
  },
]

[project.theme]
language = "en"
logo = "assets/adelpha-logo.svg"
favicon = "assets/favicon.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "start/*",
  "guide/*",
  "packaging/*",
  "project/*",
]
