[project]
site_name = "Adelpha MRI"
site_description = "Adelpha is an open-source low-field MRI console and digital twin for scanner control, acquisition, monitoring, engineering, and AI-assisted workflows."
site_author = "Adelpha contributors, Accessible Magnetic Resonance Laboratory"
site_url = "https://imr-framework.github.io/adelpha/"
repo_url = "https://github.com/imr-framework/adelpha"
copyright = """
Copyright &copy; 2026 Adelpha contributors
"""
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/download.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
extra_css = [
  "stylesheets/extra.css",
]

nav = [
  { "Get started" = [
      { "What is Adelpha?" = "index.md" },
      { Download = "start/download.md" },
      { "Getting started" = "start/index.md" },
    ]
  },

  { Guide = [
      { Architecture = "guide/architecture.md" },
      { Workspaces = "guide/workspaces.md" },
      { Settings = "guide/settings.md" },
      { Dashboard = "guide/dashboard.md" },
      { "Imaging Console" = "guide/imaging-console.md" },
      { "Twin API" = "guide/twin-api.md" },
      { Configuration = "guide/configuration.md" },
      { "Desktop packaging" = [
          { Overview = "packaging/index.md" },
          { Signing = "packaging/signing.md" },
          { Limitations = "packaging/limitations.md" },
          { Exclusions = "packaging/exclusions.md" },
          { "Adding a service" = "packaging/adding-a-service.md" },
          { "Electron migration" = "packaging/electron-migration.md" },
        ]
      },
    ]
  },

  { About = [
      { "About Adelpha" = "about/index.md" },
      { "MaRCoS integration" = "about/marcos.md" },
      { "MRI4ALL integration" = "about/mri4all.md" },
      { "Low-field MRI digital twins" = "about/digital-twins.md" },
      { "Pulse sequences and protocols" = "about/sequences.md" },
      { "Reconstruction architecture" = "about/reconstruction.md" },
      { "Research and validation" = "about/research.md" },
      { "Citation and licensing" = "about/citation.md" },
      { "Intended use" = "about/intended-use.md" },
    ]
  },

  { Project = [
      { "Docs site" = "project/docs-site.md" },
    ]
  },
]

[project.extra]
# Paste the Search Console "content" value here to emit a verification meta tag.
google_site_verification = ""

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/adelpha-logo.svg"
favicon = "assets/favicon.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "start/*",
  "guide/*",
  "packaging/*",
  "about/*",
  "project/*",
]
