name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - tauri_packaging
  pull_request:
    paths:
      - "src-tauri/**"
      - "runtime/python/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar-and-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-13
            rust_target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux WebKit/GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install JS dependencies
        run: npm ci

      - name: Supervisor unit tests
        run: |
          python -m pip install -e "./runtime/python[dev]"
          python -m pytest runtime/python/tests -q

      - name: Build Python sidecar
        run: python runtime/python/build_sidecar.py

      - name: Smoke sidecar handshake
        run: python runtime/python/smoke_sidecar.py

      - name: Build Tauri installer (unsigned unless secrets exist)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            CI=true npm run tauri:build
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY; skipping updater signatures."
            CI=true npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ -d src-tauri/target ]; then
            find src-tauri/target -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" \) -print0 \
              | xargs -0 -I{} cp {} artifacts/ || true
          fi
          copy_updater() {
            local dest="$1"
            local pattern="$2"
            local found
            found="$(find src-tauri/target -type f -name "$pattern" 2>/dev/null | head -n 1)"
            if [ -n "$found" ]; then
              cp "$found" "artifacts/$dest"
            fi
          }
          case "${{ matrix.artifact }}" in
            macos-arm64)
              copy_updater "Adelpha-darwin-aarch64.app.tar.gz" "*.app.tar.gz"
              copy_updater "Adelpha-darwin-aarch64.app.tar.gz.sig" "*.app.tar.gz.sig"
              ;;
            macos-x64)
              copy_updater "Adelpha-darwin-x86_64.app.tar.gz" "*.app.tar.gz"
              copy_updater "Adelpha-darwin-x86_64.app.tar.gz.sig" "*.app.tar.gz.sig"
              ;;
            windows-x64)
              copy_updater "Adelpha-windows-x86_64-setup.exe" "*setup.exe"
              copy_updater "Adelpha-windows-x86_64-setup.exe.sig" "*setup.exe.sig"
              ;;
            linux-x64)
              copy_updater "Adelpha-linux-x86_64.AppImage" "*.AppImage"
              copy_updater "Adelpha-linux-x86_64.AppImage.sig" "*.AppImage.sig"
              ;;
          esac
          if ls artifacts/* >/dev/null 2>&1; then
            (cd artifacts && shasum -a 256 * > "SHA256SUMS-${{ matrix.artifact }}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: adelpha-${{ matrix.artifact }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  publish-updater:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.sidecar-and-installer.result != 'cancelled'
    needs: sidecar-and-installer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Assemble latest.json
        run: |
          python3 packaging/updater/assemble_latest_json.py \
            --dir dist-artifacts \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --version "${{ github.ref_name }}" \
            --notes "Adelpha ${{ github.ref_name }}" \
            --out dist-artifacts/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "Adelpha ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist-artifacts/* --clobber
